name: CI

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Show versions
        run: python -c "import streamlit, plotly, pandas; print('::notice title=versions::streamlit', streamlit.__version__, 'plotly', plotly.__version__, 'pandas', pandas.__version__)"
      - name: Unit and app tests (synthetic data only)
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -p no:cacheprovider 2>&1 | tee pytest.txt
      - name: Report test output
        if: failure()
        run: |
          python - <<'PY'
          t = open("pytest.txt").read()[-9000:]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest output::{t}")
          PY

  screenshots:
    # Visual check of every tab, rendered with the synthetic sample workbook.
    if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start the app on sample data
        run: |
          python tests/make_sample.py /tmp/sample.xlsx
          TROLLEY_XLSX_PATH=/tmp/sample.xlsx nohup streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - name: Screenshots
        run: python tests/screenshots.py http://localhost:8501 screenshots
      - name: Report server log
        if: always()
        run: |
          python - <<'PY'
          t = open("/tmp/streamlit.log").read()[-6000:]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::warning title=streamlit log::{t}")
          PY
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screenshots && cp /tmp/streamlit.log screenshots/ || true
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
